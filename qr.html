<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR codes | Hotel Shree, Jalna</title><link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="hero"></div>
<section class="max-w-[90rem] mx-auto px-6 md:px-12 py-16"><div class="grid md:grid-cols-[1fr_1fr_auto] gap-8 items-end max-w-5xl">
 <label class="md:col-span-2"><span class="lbl">Website address (where menu.html is hosted)</span><input id="base" class="field" placeholder="https://www.hotelshree.in/"></label><button id="print" class="btn fill">Print all</button>
 <label><span class="lbl">Table numbers</span><input id="tb" class="field" value="T1-T10, L1-L4"></label><label><span class="lbl">Room numbers</span><input id="rm" class="field" value="101-110"></label><button id="gen" class="btn">Generate</button></div>
 <p class="text-xs text-mute mt-4 max-w-2xl">Use your live website address so guests can scan from anywhere. Ranges like T1-T10 or 101-110 and comma lists both work. Print on matte sticker paper and place one on every table and in every room.</p>
 <div id="sheet" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-6 mt-14"></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="assets/site.js"></script><script>
$('#hero').innerHTML=heroHTML('service.jpg','QR codes','Print one for every table and room.');
$('#base').value=location.protocol==='file:'?'':location.href.replace(/[^/]*$/,'');
function list(s,p){const o=[];s.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const m=x.match(/^([A-Za-z]*)(\d+)\s*-\s*([A-Za-z]*)(\d+)$/);if(m){for(let i=+m[2];i<=+m[4];i++)o.push(m[1]+i)}else o.push(x)});return o}
function gen(){let b=$('#base').value.trim();if(!b){toast('Enter your website address first, for example https://www.hotelshree.in/');return}if(!b.endsWith('/'))b+='/';
 const items=[...list($('#tb').value).map(x=>['t',x,'Table '+x]),...list($('#rm').value).map(x=>['r',x,'Room '+x])];$('#sheet').innerHTML='';
 items.forEach(([k,id,label],i)=>{const url=`${b}menu.html?${k}=${encodeURIComponent(id)}`;
  const c=document.createElement('div');c.className='pcard card p-6 text-center reveal in';c.style.animation=`fade .6s ${Math.min(i,20)*40}ms both`;
  c.innerHTML=`<img src="assets/logo.png" alt="" class="h-12 mx-auto mb-3"><div class="qrh bg-white p-3 inline-block"></div><p class="font-serif text-3xl mt-4">${label}</p><p class="text-xs text-mute mt-1">Scan to view the menu and order</p><button class="mt-3 text-xs text-gold border-b border-gold/40 pb-0.5 no-print">Download PNG</button>`;
  $('#sheet').appendChild(c);new QRCode($('.qrh',c),{text:url,width:150,height:150,colorDark:'#17120f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  $('button',c).onclick=()=>{const cv=$('canvas',c);const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=`hotel-shree-${label.replace(' ','-').toLowerCase()}.png`;a.click()}});
 toast(items.length+' QR codes ready.')}
$('#gen').onclick=gen;$('#print').onclick=()=>{if(!$('#sheet').children.length)gen();setTimeout(()=>print(),400)};
if($('#base').value)gen();
</script></body></html>
