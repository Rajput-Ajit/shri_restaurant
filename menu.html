<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu | Hotel Shree, Jalna</title><link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="hero"></div>
<div id="where" class="hidden bg-gold text-ink text-sm text-center py-3 tracking-wide"></div>
<div class="sticky top-[5.5rem] z-40 bg-ink/95 backdrop-blur border-b border-gold/20"><div class="max-w-[90rem] mx-auto px-6 md:px-12 py-4 flex flex-col md:flex-row gap-4 md:items-center">
 <div id="cats" class="scroll-x flex gap-2 overflow-x-auto flex-1"></div>
 <div class="flex items-center gap-4"><div class="flex border border-gold/30 text-xs" id="vf"><button data-v="" class="px-4 py-2 bg-gold text-ink">All</button><button data-v="v" class="px-4 py-2 flex items-center gap-2"><i class="vegdot veg"></i>Veg</button><button data-v="n" class="px-4 py-2 flex items-center gap-2"><i class="vegdot nonveg"></i>Non-veg</button></div>
 <input id="q" class="field !w-44 !py-2 text-sm" placeholder="Search dishes"></div></div></div>
<section class="max-w-[90rem] mx-auto px-6 md:px-12 py-16" id="menu"></section>
<p class="max-w-[90rem] mx-auto px-6 md:px-12 pb-28 text-xs text-mute">Prices are in rupees and include or exclude taxes as shown on your bill. Please tell your server about any food allergies.</p>

<button id="cartBtn" class="fixed bottom-6 right-6 z-[120] btn fill !py-4 translate-y-24 opacity-0 transition-all duration-500 shadow-2xl pulse">View order &middot; <span id="cc">0</span> &middot; <span id="ct"></span></button>
<div class="veil" id="vl"></div>
<aside class="drawer" id="dr"><div class="p-8 border-b border-gold/20 flex justify-between"><div><p class="lbl">Your order</p><h3 class="font-serif text-4xl mt-1" id="dw">Table</h3></div><button id="dx" class="text-3xl hover:text-gold transition" aria-label="Close">&times;</button></div>
 <div class="flex-1 overflow-auto p-8" id="items"></div>
 <form id="of" class="p-8 border-t border-gold/20 space-y-5"><div class="grid grid-cols-2 gap-5"><label><span class="lbl">Table or room</span><input class="field" id="loc" required placeholder="T3 or 101"></label><label><span class="lbl">Your name</span><input class="field" id="nm" required></label></div>
 <label class="block"><span class="lbl">Note for the kitchen</span><input class="field" id="nt" placeholder="Less spicy, no onion..."></label>
 <div class="flex justify-between items-baseline"><span class="text-mute text-sm">Total</span><span class="font-serif text-3xl text-gold" id="tot"></span></div><button class="btn fill w-full">Place order</button></form></aside>
<div id="ok" class="modal"><div class="max-w-md w-full bg-coal border border-gold/40 p-10 text-center fade" id="okb"></div></div>
<script src="assets/site.js"></script><script>
$('#hero').innerHTML=heroHTML('pasta.jpg','Menu','Browse the full card, then order from your table or room.');
/* ---- EDIT MENU HERE (prices are placeholders). v=1 veg, 0 non-veg ---- */
const MENU=[
['Starters',[['Paneer Tikka',1,249,'Char-grilled cottage cheese with mint chutney.'],['Hara Bhara Kabab',1,199,'Spinach and green pea patties.'],['Chicken Tikka',0,299,'Tandoor-roasted, yoghurt marinade.'],['Chicken 65',0,279,'Crisp and spicy, curry leaf tempering.'],['Fish Fingers',0,329,'Golden fried with tartare dip.']]],
['Main course',[['Paneer Butter Masala',1,269,'Rich tomato and cashew gravy.'],['Dal Tadka',1,189,'Yellow lentils with ghee and garlic.'],['Veg Kolhapuri',1,239,'A spicy Maharashtrian classic.'],['Butter Chicken',0,329,'Creamy tomato gravy, tandoori chicken.'],['Chicken Kolhapuri',0,339,'Fiery red gravy, local style.']]],
['Biryani and rice',[['Veg Biryani',1,229,'Fragrant basmati with vegetables and raita.','biryani.jpg'],['Chicken Biryani',0,299,'Slow-cooked in a clay pot (dum).','biryani.jpg'],['Mutton Biryani',0,399,'Tender mutton, saffron rice.','biryani.jpg'],['Jeera Rice',1,149,'Cumin-tempered basmati.']]],
['Breads',[['Butter Naan',1,49,'Soft, tandoor-baked.'],['Tandoori Roti',1,29,'Whole wheat, from the clay oven.'],['Garlic Naan',1,59,'Topped with garlic and coriander.']]],
['Continental',[['Penne Arrabbiata',1,279,'Tomato, chilli and basil.','pasta.jpg'],['Grilled Fish',0,449,'Herb crust with lemon butter.','salmon.jpg'],['Margherita Pizza',1,299,'Mozzarella, tomato and fresh basil.','pizza.jpg'],['Chicken Pizza',0,349,'Tikka chicken, peppers, cheese.','pizza.jpg']]],
['Breakfast',[['Poha',1,89,'Light and lemony, with sev.'],['Masala Omelette',0,99,'Two eggs, onion, chilli.'],['Continental Platter',0,249,'Eggs, toast, fruit, juice and coffee.','breakfast.jpg']]],
['Beverages',[['Masala Chai',1,39,'Brewed with ginger and cardamom.'],['Fresh Lime Soda',1,79,'Sweet, salted or mixed.'],['Cold Coffee',1,119,'Blended with ice cream.'],['Soft Drink',1,59,'Chilled, 300 ml.']]]];
const inr=n=>'\u20B9'+n.toLocaleString('en-IN');
const P=new URLSearchParams(location.search),LOC=P.get('t')?'Table '+P.get('t'):P.get('r')?'Room '+P.get('r'):'';
const F={cat:'',v:'',q:''},cart={};
if(LOC){$('#where').classList.remove('hidden');$('#where').innerHTML=`Ordering for <b class="font-medium">${LOC}</b>. Pick your dishes and place the order.`;$('#loc').value=LOC.split(' ')[1]}
$('#cats').innerHTML=['All',...MENU.map(m=>m[0])].map((c,i)=>`<button data-c="${i?c:''}" class="chip whitespace-nowrap" aria-pressed="${!i}">${c}</button>`).join('');
$('#cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.cat=b.dataset.c;$$('#cats .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('#vf').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.v=b.dataset.v;$$('#vf button').forEach(x=>{const on=x===b;x.classList.toggle('bg-gold',on);x.classList.toggle('text-ink',on)});render()};
$('#q').oninput=e=>{F.q=e.target.value.toLowerCase();render()};
function render(){let h='';MENU.forEach(([c,items])=>{if(F.cat&&F.cat!==c)return;
 const a=items.filter(i=>(!F.v||(F.v==='v')===!!i[1])&&(!F.q||(i[0]+i[3]).toLowerCase().includes(F.q)));if(!a.length)return;
 h+=`<div class="mb-20"><div class="orn mb-10"><h2 class="font-serif text-5xl md:text-6xl text-ivory px-2">${c}</h2></div><div class="grid md:grid-cols-2 gap-x-14 gap-y-4">${a.map(i=>{const k=i[0],n=cart[k]?.q||0;return `<div class="card p-6 flex gap-5 items-center reveal in">${i[4]?`<div class="w-24 h-24 flex-none overflow-hidden zoom"><img src="assets/${i[4]}" alt="" class="w-full h-full object-cover" loading="lazy"></div>`:''}
 <div class="flex-1 min-w-0"><div class="flex items-center gap-2"><i class="vegdot ${i[1]?'veg':'nonveg'}"></i><h3 class="font-serif text-2xl truncate">${k}</h3></div><p class="text-sm text-mute mt-1 leading-snug">${i[3]}</p><p class="text-gold mt-2">${inr(i[2])}</p></div>
 <div class="flex-none">${n?`<div class="flex items-center border border-gold"><button class="w-9 h-9 hover:bg-gold hover:text-ink transition" data-m="${k}">&minus;</button><span class="w-8 text-center">${n}</span><button class="w-9 h-9 hover:bg-gold hover:text-ink transition" data-a="${k}">+</button></div>`:`<button class="btn !px-5 !py-2.5 !text-[.7rem]" data-a="${k}">Add</button>`}</div></div>`}).join('')}</div></div>`});
 $('#menu').innerHTML=h||'<p class="text-center text-mute py-24">No dishes match. Try another filter.</p>'}
const find=k=>MENU.flatMap(m=>m[1]).find(i=>i[0]===k);
function upd(){const ks=Object.keys(cart),c=ks.reduce((s,k)=>s+cart[k].q,0),t=ks.reduce((s,k)=>s+cart[k].q*cart[k].p,0);
 $('#cc').textContent=c+(c===1?' item':' items');$('#ct').textContent=inr(t);$('#tot').textContent=inr(t);const b=$('#cartBtn');b.classList.toggle('translate-y-24',!c);b.classList.toggle('opacity-0',!c);
 $('#items').innerHTML=c?ks.map(k=>`<div class="flex items-center justify-between gap-3 py-4 border-b border-white/10"><div><div class="font-serif text-xl">${k}</div><div class="text-xs text-mute">${inr(cart[k].p)} each</div></div><div class="flex items-center border border-gold/60"><button class="w-8 h-8 hover:bg-gold hover:text-ink transition" data-m="${k}">&minus;</button><span class="w-7 text-center text-sm">${cart[k].q}</span><button class="w-8 h-8 hover:bg-gold hover:text-ink transition" data-a="${k}">+</button></div><div class="w-16 text-right">${inr(cart[k].q*cart[k].p)}</div></div>`).join(''):'<p class="text-mute">Your order is empty.</p>';
 if(!c)closeD()}
document.addEventListener('click',e=>{const a=e.target.dataset.a,m=e.target.dataset.m;
 if(a){const i=find(a);cart[a]=cart[a]||{q:0,p:i[2],v:i[1]};cart[a].q++;render();upd()}
 if(m&&cart[m]){if(--cart[m].q<=0)delete cart[m];render();upd()}});
const openD=()=>{$('#dw').textContent=LOC||'Your table';$('#dr').classList.add('open');$('#vl').classList.add('open')},closeD=()=>{$('#dr').classList.remove('open');$('#vl').classList.remove('open')};
$('#cartBtn').onclick=openD;$('#dx').onclick=closeD;$('#vl').onclick=closeD;
const KEY='shree_orders_v1',load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}};
$('#of').onsubmit=e=>{e.preventDefault();const ks=Object.keys(cart);if(!ks.length)return;
 const o={id:'OD-'+Math.random().toString(36).slice(2,6).toUpperCase(),loc:$('#loc').value.trim(),name:$('#nm').value.trim(),note:$('#nt').value.trim(),items:ks.map(k=>({n:k,q:cart[k].q,p:cart[k].p})),total:ks.reduce((s,k)=>s+cart[k].q*cart[k].p,0),at:Date.now(),status:'new'};
 try{localStorage.setItem(KEY,JSON.stringify([...load(),o]))}catch{}
 const txt=`New order ${o.id} for ${o.loc} (${o.name}):\n${o.items.map(i=>`${i.q} x ${i.n}`).join('\n')}\nTotal ${inr(o.total)}${o.note?'\nNote: '+o.note:''}`;
 $('#okb').innerHTML=`<img src="assets/logo.png" class="h-20 mx-auto mb-5" alt=""><p class="lbl">Order placed</p><h3 class="font-serif text-6xl text-gold mt-2">${o.id}</h3><div class="rule my-6"></div><p class="text-ivory/80">${o.items.length} dish${o.items.length>1?'es':''} for ${o.loc}.<br>Total ${inr(o.total)} (plus taxes).</p><div class="flex flex-col gap-3 mt-8">${CONFIG.whatsapp?`<a class="btn fill" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}">Send order to kitchen</a>`:''}<button class="btn" id="okc">Done</button></div>`;
 $('#ok').classList.add('open');Object.keys(cart).forEach(k=>delete cart[k]);closeD();render();upd();$('#okc').onclick=()=>$('#ok').classList.remove('open')};
render();upd();
</script></body></html>
