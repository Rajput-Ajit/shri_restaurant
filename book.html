<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book a room | Hotel Shree, Jalna</title><link rel="icon" href="assets/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="assets/tw.js"></script><link rel="stylesheet" href="assets/style.css"></head>
<body><div id="hero"></div>
<div class="sticky top-[5.5rem] z-40 bg-ink/95 backdrop-blur border-y border-gold/20"><form id="sf" class="max-w-[90rem] mx-auto px-6 md:px-12 py-4 grid grid-cols-2 md:grid-cols-[1.3fr_1fr_1fr_1fr_auto] gap-x-6 gap-y-3 items-end">
 <div class="col-span-2 md:col-span-1"><span class="lbl">Hotel</span><div class="py-2.5 font-serif text-xl">Hotel Shree, Jalna</div></div>
 <label><span class="lbl">Check in</span><input type="date" id="ci" class="field !py-2"></label><label><span class="lbl">Check out</span><input type="date" id="co" class="field !py-2"></label>
 <label><span class="lbl">Guests</span><select id="gu" class="field !py-2"></select></label><button class="btn fill !py-3 col-span-2 md:col-span-1">Search</button></form></div>
<section class="max-w-[90rem] mx-auto px-6 md:px-12 py-14 grid lg:grid-cols-[17rem_1fr] gap-12">
 <aside class="space-y-9 lg:sticky lg:top-52 self-start">
  <h2 class="font-serif text-4xl">Filters</h2>
  <div><p class="lbl mb-3">Max price per night</p><input type="range" id="pr" class="w-full" min="500" max="6000" step="100" value="6000"><div class="flex justify-between text-sm mt-1"><span class="text-mute">&#8377;500</span><b class="font-normal text-gold" id="prv">&#8377;6000</b></div></div>
  <div><p class="lbl mb-3">Room type</p><div id="ft" class="space-y-2 text-sm"></div></div>
  <div><p class="lbl mb-3">Amenities</p><div id="fa" class="space-y-2 text-sm"></div></div>
  <button id="clr" class="text-xs text-gold border-b border-gold/40 pb-0.5">Clear filters</button></aside>
 <div><div class="flex flex-wrap items-end justify-between gap-4 pb-6 border-b border-white/10"><div><p class="text-xs text-mute">Hotel Shree &gt; Rooms</p><h2 class="font-serif text-4xl md:text-5xl" id="rc">Rooms</h2></div>
  <label class="flex items-center gap-3 text-sm"><span class="lbl">Sort by</span><select id="so" class="field !w-auto !py-2"><option value="p">Popularity</option><option value="l">Price: low to high</option><option value="h">Price: high to low</option></select></label></div>
  <div id="list" class="divide-y divide-white/10"></div></div></section>
<section class="max-w-[90rem] mx-auto px-6 md:px-12 pb-28 hidden" id="mine"><div class="rule mb-14"></div><h2 class="font-serif text-4xl mb-8">Room bookings on this device</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5" id="ml"></div></section>
<div class="veil" id="vl"></div>
<div id="dm" class="modal"><div class="max-w-4xl w-full bg-coal border border-gold/30 relative fade" id="dmb"></div></div>
<aside class="drawer" id="dr"></aside>
<script src="assets/site.js"></script><script>
$('#hero').innerHTML=heroHTML('room-premium.jpg','Book a room','Choose your dates, pick a room, and confirm in a minute.');
/* ---- EDIT ROOM DATA HERE (prices are placeholders) ---- */
const ROOMS=[
 {id:'std',n:'Standard Room',t:'Standard',img:'room-standard.jpg',p:1299,sl:2,st:4,am:['Air-conditioned','Smart TV','Free Wi-Fi','Work shelf'],d:'Compact and bright with a large TV and a work shelf. A good choice for a short business stay.'},
 {id:'twin',n:'Twin Room',t:'Twin',img:'room-twin.jpg',p:1599,sl:2,st:3,am:['Two beds','Tea kettle','Free Wi-Fi','Air-conditioned'],d:'Two beds with a tea kettle and bedside lamps. Easy for colleagues and friends travelling together.'},
 {id:'dlx',n:'Deluxe King',t:'Deluxe',img:'room-king.jpg',p:1899,sl:2,st:3,am:['King bed','Work desk','Mini fridge','Free Wi-Fi','Air-conditioned'],d:'A king bed, a desk and a mini fridge, with room to spread out on longer stays.'},
 {id:'dtw',n:'Deluxe Twin',t:'Deluxe',img:'room-deluxe.jpg',p:2099,sl:3,st:2,am:['Window view','Seating area','Free Wi-Fi','Smart TV'],d:'A bright room with a window view and a seating corner to read or work.'},
 {id:'prm',n:'Premium Room',t:'Premium',img:'room-premium.jpg',p:2499,sl:3,st:2,am:['Twin beds','Smart TV','Wardrobe','Free Wi-Fi','Air-conditioned'],d:'Warm lighting, twin beds and a wall-mounted TV for a more relaxed evening.'},
 {id:'ste',n:'Family Suite',t:'Suite',img:'room-suite.jpg',p:3499,sl:4,st:2,am:['Sleeps 4','Large TV','Wardrobe','Ceiling fan','Free Wi-Fi'],d:'Two large beds, wood panelling and plenty of space for the whole family.'}];
const ALL=ROOMS.map(r=>r.img),gal=r=>[r.img,...ALL.filter(x=>x!==r.img)].slice(0,5);
const KEY='shree_rooms_v1',load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},save=b=>{try{localStorage.setItem(KEY,JSON.stringify(b))}catch{}};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),addD=(s,n)=>iso(new Date(new Date(s+'T00:00').getTime()+n*864e5));
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const nights=()=>Math.max(1,Math.round((new Date(S.co)-new Date(S.ci))/864e5)),inr=n=>'\u20B9'+n.toLocaleString('en-IN');
const S={ci:iso(new Date()),co:addD(iso(new Date()),1),g:2,max:6000,types:new Set(),am:new Set(),sort:'p'};
const left=r=>r.st-load().filter(b=>b.status==='confirmed'&&b.room===r.id&&b.ci<S.co&&b.co>S.ci).length;
$('#gu').innerHTML=Array.from({length:6},(_,i)=>`<option value="${i+1}" ${i===1?'selected':''}>${i+1} ${i?'guests':'guest'}</option>`).join('');
const ci=$('#ci'),co=$('#co');ci.min=S.ci;ci.value=S.ci;co.min=S.co;co.value=S.co;
ci.onchange=()=>{S.ci=ci.value;co.min=addD(S.ci,1);if(co.value<=S.ci)co.value=addD(S.ci,1);S.co=co.value;draw()};co.onchange=()=>{S.co=co.value;draw()};$('#gu').onchange=e=>{S.g=+e.target.value;draw()};
$('#sf').onsubmit=e=>{e.preventDefault();draw();$('#list').scrollIntoView({behavior:'smooth',block:'start'})};
const types=[...new Set(ROOMS.map(r=>r.t))],ams=[...new Set(ROOMS.flatMap(r=>r.am))].slice(0,8);
const chk=(id,v)=>`<label class="flex items-center gap-3 cursor-pointer hover:text-gold transition"><input type="checkbox" data-${id}="${v}">${v}</label>`;
$('#ft').innerHTML=types.map(v=>chk('t',v)).join('');$('#fa').innerHTML=ams.map(v=>chk('a',v)).join('');
$('#pr').oninput=e=>{S.max=+e.target.value;$('#prv').textContent=inr(S.max);draw()};$('#so').onchange=e=>{S.sort=e.target.value;draw()};
document.addEventListener('change',e=>{const t=e.target.dataset;if(t.t){e.target.checked?S.types.add(t.t):S.types.delete(t.t);draw()}if(t.a){e.target.checked?S.am.add(t.a):S.am.delete(t.a);draw()}});
$('#clr').onclick=()=>{S.types.clear();S.am.clear();S.max=6000;$('#pr').value=6000;$('#prv').textContent=inr(6000);$$('aside input[type=checkbox]').forEach(c=>c.checked=false);draw()};
function view(){let a=ROOMS.filter(r=>r.p<=S.max&&r.sl>=S.g&&(!S.types.size||S.types.has(r.t))&&[...S.am].every(x=>r.am.includes(x)));
 if(S.sort==='l')a.sort((x,y)=>x.p-y.p);if(S.sort==='h')a.sort((x,y)=>y.p-x.p);return a}
function draw(){const a=view(),n=nights();$('#rc').textContent=`${a.length} room type${a.length===1?'':'s'} available`;
 $('#list').innerHTML=a.length?a.map(r=>{const l=left(r),im=gal(r);return `<article class="py-10 grid md:grid-cols-[minmax(0,1.25fr)_1fr] gap-8" data-id="${r.id}">
 <div class="flex gap-1.5 h-[17rem] md:h-[19rem]"><div class="relative flex-1 overflow-hidden frame"><img class="main absolute inset-0 w-full h-full object-cover transition duration-500" src="assets/${im[0]}" alt="${r.n}"><span class="absolute top-4 left-4 bg-ivory text-ink text-xs px-3 py-1.5 font-medium z-10">Hotel Shree</span></div>
 <div class="w-24 flex flex-col gap-1.5">${im.slice(1).map(x=>`<img data-s="${x}" src="assets/${x}" class="thumb flex-1 min-h-0 w-full object-cover" alt="">`).join('')}</div></div>
 <div class="flex flex-col"><div class="flex justify-between gap-3"><div><h3 class="font-serif text-4xl">${r.n}</h3><p class="text-sm text-mute mt-1">Sleeps ${r.sl} &middot; Jalna-Ambad Road</p></div>${l<=2&&l>0?`<span class="text-xs text-ember text-right max-w-[7rem]">Only ${l} left for these dates</span>`:''}</div>
 <p class="text-sm text-ivory/70 mt-4 leading-relaxed">${r.d}</p><ul class="flex flex-wrap gap-x-5 gap-y-2 mt-4 text-sm text-champ">${r.am.slice(0,4).map(x=>`<li><span class="text-gold">&#10003;</span> ${x}</li>`).join('')}</ul>
 <div class="mt-auto pt-6"><div class="flex items-baseline gap-3"><span class="font-serif text-5xl">${inr(r.p)}</span><span class="text-xs text-mute">per room per night</span></div><p class="text-xs text-mute mt-1">${n} night${n>1?'s':''}: ${inr(r.p*n)} &middot; plus taxes as applicable</p>
 <div class="flex gap-3 mt-5"><button class="btn !px-6" data-v="${r.id}">View details</button><button class="btn fill !px-8" data-b="${r.id}" ${l<=0?'disabled':''}>${l<=0?'Sold out':'Book now'}</button></div></div></div></article>`}).join(''):'<p class="py-20 text-center text-mute">No rooms match these filters. Try clearing a filter or changing the guests.</p>';
 $$('#list article').forEach(el=>{const m=$('.main',el);$$('.thumb',el).forEach(t=>t.onmouseenter=t.onclick=()=>{m.style.opacity=0;setTimeout(()=>{m.src='assets/'+t.dataset.s;m.style.opacity=1},200);$$('.thumb',el).forEach(x=>x.classList.toggle('on',x===t))})})}
const R=id=>ROOMS.find(r=>r.id===id),closeAll=()=>{$('#dm').classList.remove('open');$('#dr').classList.remove('open');$('#vl').classList.remove('open');document.body.style.overflow=''};
$('#vl').onclick=closeAll;addEventListener('keydown',e=>e.key==='Escape'&&closeAll());
$('#dm').onclick=e=>{if(e.target.id==='dm')closeAll()};
document.addEventListener('click',e=>{const v=e.target.dataset.v,b=e.target.dataset.b;if(v)details(R(v));if(b)drawer(R(b))});
function details(r){const im=gal(r);$('#dmb').innerHTML=`<button class="absolute top-4 right-5 text-3xl z-10 hover:text-gold transition" onclick="closeAll()" aria-label="Close">&times;</button><div class="grid md:grid-cols-2"><div class="grid grid-cols-2 gap-1">${im.slice(0,4).map((x,i)=>`<img src="assets/${x}" class="w-full h-full object-cover ${i===0?'col-span-2 aspect-[16/10]':'aspect-[4/3]'}" alt="">`).join('')}</div>
 <div class="p-8 md:p-10 flex flex-col"><h3 class="font-serif text-5xl">${r.n}</h3><p class="mt-4 text-ivory/75 leading-relaxed">${r.d}</p><p class="lbl mt-8 mb-3">Room features</p><ul class="grid grid-cols-2 gap-y-3 text-sm text-champ">${r.am.map(x=>`<li><span class="text-gold">&#10022;</span> ${x}</li>`).join('')}</ul><p class="text-xs text-mute mt-6">A valid photo ID is required at check-in. The front desk confirms check-in and check-out times.</p><div class="mt-auto pt-8 flex items-center justify-between"><div><span class="font-serif text-4xl">${inr(r.p)}</span><span class="text-xs text-mute"> / night</span></div><button class="btn fill" data-b="${r.id}">Book now</button></div></div></div>`;
 $('#dm').classList.add('open');document.body.style.overflow='hidden'}
function drawer(r){$('#dm').classList.remove('open');const n=nights();
 $('#dr').innerHTML=`<div class="p-8 border-b border-gold/20 flex justify-between items-start"><div><p class="lbl">Booking</p><h3 class="font-serif text-4xl mt-1">${r.n}</h3></div><button onclick="closeAll()" class="text-3xl hover:text-gold transition" aria-label="Close">&times;</button></div>
 <form id="bf" class="p-8 flex-1 overflow-auto space-y-7"><dl class="text-sm space-y-3"><div class="flex justify-between"><dt class="text-mute">Check in</dt><dd>${fd(S.ci)}</dd></div><div class="flex justify-between"><dt class="text-mute">Check out</dt><dd>${fd(S.co)}</dd></div><div class="flex justify-between"><dt class="text-mute">Guests</dt><dd>${S.g}</dd></div><div class="flex justify-between border-t border-white/10 pt-3"><dt>Total (${n} night${n>1?'s':''})</dt><dd class="font-serif text-2xl text-gold">${inr(r.p*n)}</dd></div></dl>
 <label class="block"><span class="lbl">Full name</span><input class="field" id="bn" required autocomplete="name"></label><label class="block"><span class="lbl">Phone</span><input class="field" id="bp" type="tel" required pattern="[0-9+ ]{10,15}" autocomplete="tel"></label><label class="block"><span class="lbl">Request (optional)</span><input class="field" id="bq" placeholder="Early check-in, extra bed..."></label>
 <p class="text-xs text-mute">Pay at the hotel. Taxes are added at check-in. Please carry a valid photo ID.</p><button class="btn fill w-full">Confirm booking</button></form>`;
 $('#dr').classList.add('open');$('#vl').classList.add('open');
 $('#bf').onsubmit=e=>{e.preventDefault();if(left(r)<=0)return toast('Sorry, this room just sold out.');
  const b={id:'RM-'+Math.random().toString(36).slice(2,7).toUpperCase(),room:r.id,ci:S.ci,co:S.co,g:S.g,total:r.p*n,name:$('#bn').value.trim(),phone:$('#bp').value.trim(),note:$('#bq').value.trim(),status:'confirmed'};
  save([...load(),b]);closeAll();done(b,r);draw();mine()}}
function done(b,r){const msg=`Hello Hotel Shree, room booking ${b.id}: ${r.n}, ${fd(b.ci)} to ${fd(b.co)}, ${b.g} guests. Name: ${b.name}.`;
 $('#dmb').innerHTML=`<div class="p-10 text-center max-w-md mx-auto"><img src="assets/logo.png" class="h-20 mx-auto mb-5" alt=""><p class="lbl">Room booked</p><h3 class="font-serif text-6xl text-gold mt-2">${b.id}</h3><div class="rule my-6"></div><p class="font-serif text-3xl">${r.n}</p><p class="mt-3 text-ivory/75">${fd(b.ci)} to ${fd(b.co)}<br>${b.g} guests &middot; ${inr(b.total)} + taxes</p><div class="flex flex-col gap-3 mt-8">${CONFIG.whatsapp?`<a class="btn fill" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}">Send on WhatsApp</a>`:''}<button class="btn" onclick="closeAll()">Done</button></div></div>`;$('#dm').classList.add('open');document.body.style.overflow='hidden'}
function mine(){const l=load().sort((a,b)=>a.ci.localeCompare(b.ci));$('#mine').classList.toggle('hidden',!l.length);
 $('#ml').innerHTML=l.map(b=>`<div class="card p-6 ${b.status==='cancelled'?'opacity-40':''}"><div class="flex justify-between"><span class="font-serif text-2xl text-gold">${b.id}</span><span class="lbl">${b.status}</span></div><p class="mt-3">${R(b.room).n}</p><p class="text-sm text-mute">${fd(b.ci)} to ${fd(b.co)} &middot; ${b.g} guests</p>${b.status==='confirmed'?`<button data-c="${b.id}" class="mt-4 text-xs text-gold border-b border-gold/40 pb-0.5">Cancel booking</button>`:''}</div>`).join('')}
$('#ml').onclick=e=>{const c=e.target.dataset.c;if(c&&confirm('Cancel this booking?')){save(load().map(b=>b.id===c?{...b,status:'cancelled'}:b));draw();mine();toast('Booking cancelled.')}};
draw();mine();
</script></body></html>
